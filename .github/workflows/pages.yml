name: Check

# Tests and a static build only. GitHub Pages publishes the committed docs/
# folder from branch main. This workflow must not deploy, or it would compete
# with that source. Do not put this project in the healthlog repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the existing HealthLog repository
        if: github.event.repository.name == 'healthlog'
        run: |
          echo "Refusing to run. This tracker must not replace https://yyjason5565.github.io/healthlog/."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Base path from this repository name
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
