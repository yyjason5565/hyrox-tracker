name: GitHub Pages

# Builds a static site and deploys it only from the GitHub repository that
# contains this file. Do not put this project in the healthlog repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the existing HealthLog repository
        if: github.event.repository.name == 'healthlog'
        run: |
          echo "Refusing to deploy. This tracker must not replace https://yyjason5565.github.io/healthlog/."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Base path from this repository name
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to this repository's GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
